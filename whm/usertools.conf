# UserTools Settings — WHM plugin AppConfig.
#
# Installed to /var/cpanel/apps/usertools.conf (0644) and registered with
# /usr/local/cpanel/bin/register_appconfig (see the Guide to WHM Plugins -
# AppConfig Registration); cpsrvd picks changes up on restart. Root only:
# the `all` ACL means only root (all privileges) may open it.
service=whostmgr
user=root
# `url` is docroot-relative with a leading slash (required); `entryurl` is
# the WHM menu link and must NOT carry the cgi/ prefix (WHM resolves it
# relative to its cgi/ dir, so cgi/... becomes /cgi/cgi/... 404). Per the
# Guide to WHM Plugins - AppConfig Configuration File.
url=/cgi/addon_usertools_settings.cgi
acls=all
displayname=UserTools Settings
entryurl=addon_usertools_settings.cgi
searchtext=UserTools permissions shell Laravel
