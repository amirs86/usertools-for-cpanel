name: ci

on:
  push:
  pull_request:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile check (py3.9)
        run: python -m py_compile engine/perm_engine.py engine/recipe_worker.py
      - name: Install pytest
        run: python -m pip install "pytest<9"
      - name: Run engine tests
        run: python -m pytest tests/ -q
  perl-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test deps
        run: sudo apt-get update && sudo apt-get install -y libtemplate-perl
      - name: Compile check (UAPI module, off-server stubs)
        run: perl -Itests/lib -c Cpanel/API/UserTools.pm
      - name: Run Perl unit tests
        run: prove -Itests/lib -Iadmin tests/
      - name: Static template render
        run: perl tests/render_check.pl
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check installer
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n bootstrap-install.sh
          bash -n bin/usertools-update
          bash -n tests/test_install.sh
          bash -n tests/test_update.sh
      - name: Installer unit tests
        run: bash tests/test_install.sh
      - name: Updater unit tests
        run: bash tests/test_update.sh
  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shellcheck (pinned to the version the suites are linted with)
        run: python -m pip install shellcheck-py==0.11.0.1 && shellcheck --version
      - name: Shellcheck all shell files
        run: shellcheck install.sh uninstall.sh bootstrap-install.sh bin/usertools-update tests/test_install.sh tests/test_update.sh
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install ruff
        run: pipx install ruff
      - name: "Ruff check engine (ruff.toml gate: errors, not style)"
        run: ruff check engine/
  lint-perl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install perlcritic
        run: sudo apt-get update && sudo apt-get install -y libperl-critic-perl
      - name: Perlcritic (severity 4, gentle, shipped code only)
        run: perlcritic --severity 4 admin/ Cpanel/ hooks/ whm/
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks binary (checksum-verified)
        run: |
          ver="8.16.0"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_checksums.txt"
          grep "gitleaks_${ver}_linux_x64.tar.gz" "gitleaks_${ver}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${ver}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Gitleaks detect (full history)
        run: gitleaks detect --source . --log-opts=--all --verbose
  release:
    runs-on: ubuntu-latest
    needs: [engine-tests, perl-tests, shell, lint-shell, lint-python, lint-perl, secrets]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build release tarball (LF, umask 022, dev paths excluded)
        run: |
          ver="${GITHUB_REF_NAME}"
          base="usertools-for-cpanel-${ver}"
          git -c core.eol=lf -c core.autocrlf=false -c tar.umask=022 archive --format=tar.gz --prefix="${base}/" -o "${base}.tar.gz" HEAD
          sha256sum "${base}.tar.gz" > "${base}.tar.gz.sha256"
          tar -tzf "${base}.tar.gz" | head -n 50
          cat "${base}.tar.gz.sha256"
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - name: Keyless-sign the tarball (Sigstore bundle)
        run: |
          ver="${GITHUB_REF_NAME}"
          base="usertools-for-cpanel-${ver}"
          cosign sign-blob "${base}.tar.gz" --bundle "${base}.tar.gz.sigstore.json" --yes
      # Never mark releases as pre-releases: bin/usertools-update finds new
      # versions via GitHub's releases/latest, which skips pre-releases.
      - name: Attach tarball to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            usertools-for-cpanel-*.tar.gz
            usertools-for-cpanel-*.tar.gz.sha256
            usertools-for-cpanel-*.tar.gz.sigstore.json
            bootstrap-install.sh
